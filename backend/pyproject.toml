[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
